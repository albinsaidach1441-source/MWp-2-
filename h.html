<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Web Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            transition: 0.3s;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background: #444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        main {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
            text-align: center;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        .dark {
            background-color: #1e1e1e;
            color: white;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #222;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<main>
    <section class="card">
        <h2>Hello World 🚀</h2>
        <p id="message">Klik tombol untuk mengubah teks.</p>

        <input type="text" id="nameInput" placeholder="Masukkan nama kamu">
        <br>

        <button onclick="changeText()">Ubah Teks</button>
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </section>
</main>

<footer>
    <p>&copy; 2026 My Website | Dibuat dengan HTML, CSS, JS</p>
</footer>

<script>
    function changeText() {
        let name = document.getElementById("nameInput").value;
        let message = document.getElementById("message");

        if (name === "") {
            message.innerHTML = "Silakan masukkan nama dulu!";
        } else {
            message.innerHTML = "Halo " + name + ", selamat datang!";
        }
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark");
    }
</script>

</body>
</html>
